name: docker-build

# Validate that compose.yml parses and every service image builds. Was a
# 7-image matrix; replaced with a single `compose build` because:
#   - same coverage (any broken Dockerfile or missing build-context file
#     fails the same way)
#   - 5× faster wall-clock (one buildkit cache, one runner)
#   - no app-prod-vs-dev split — the dev target catches all the Dockerfile
#     issues we care about pre-deploy

on:
  push:
    branches: [main]
    paths:
      - "services/**/Dockerfile"
      - "services/**/Dockerfile.*"
      - "compose.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "services/**"
      - "compose.yml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The default GitHub-hosted runner has ~14 GB of free disk. Building
      # 7 service images that collectively pull torch + nvidia wheels +
      # ollama + firebase-tools easily exceeds that. Free ~30 GB by
      # dropping host content the runner doesn't need for docker-build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          docker system prune -af || true
          df -h

      - uses: docker/setup-buildx-action@v4

      - name: Validate compose.yml
        run: docker compose -f compose.yml config --quiet

      - name: Build all service images (no push)
        env:
          COMPOSE_BAKE: "true"
          DOCKER_BUILDKIT: "1"
        run: docker compose -f compose.yml build
