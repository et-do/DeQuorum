name: docker-build

# Build (don't push) every service's Docker image to catch broken Dockerfiles
# and missing build-context files. Also validates compose.yml. No registry
# auth required; uses GHA layer cache.

on:
  push:
    branches: [main]
    paths:
      - "services/**/Dockerfile"
      - "services/**/Dockerfile.*"
      - "compose.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "services/**"
      - "compose.yml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: app, context: services/app, target: dev }
          - { name: app-prod, context: services/app, target: prod }
          - { name: frontend, context: services/frontend, target: dev }
          - { name: db, context: services/db, target: "" }
          - { name: ollama, context: services/ollama, target: "" }
          - { name: proxy, context: services/proxy, target: "" }
          - { name: auth, context: services/auth, target: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/Dockerfile
          target: ${{ matrix.service.target }}
          push: false
          load: true
          tags: dequorum-${{ matrix.service.name }}:ci
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose.yml
        run: docker compose -f compose.yml config --quiet
