# DeQuorum local development stack.
#
# Mirrors the production architecture:
#   - Cloud Run    <-> app, ollama
#   - Cloud SQL    <-> db
#   - Firebase     <-> auth, frontend (Hosting)
#
# Bring up the whole stack:
#     docker compose up
#
# Bring up only the backend (no frontend / proxy):
#     docker compose up app db ollama
#
# Open http://localhost in your browser. The proxy routes / to the Vite dev
# server and /api/* to the FastAPI app.

name: dequorum

services:

  # --- Postgres ---------------------------------------------------------
  db:
    build:
      context: ./services/db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-only-not-for-prod
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images require the volume at /var/lib/postgresql (data lands in
      # a major-version subdirectory); the old /var/lib/postgresql/data mount is
      # rejected. See docker-library/postgres#1259.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Ollama LLM inference server --------------------------------------
  # Uses the upstream image directly + a bind-mounted entrypoint so
  # `compose up` doesn't trigger a docker build for a 4-line Dockerfile
  # (which was pulling `ollama/ollama:latest` on every up and adding
  # ~15min when the upstream :latest tag had moved). The Dockerfile at
  # services/ollama/Dockerfile is retained as the production target —
  # local dev pins a version here and bumps it explicitly.
  ollama:
    image: ollama/ollama:0.30.5
    pull_policy: missing
    entrypoint: ["/entrypoint.sh"]
    environment:
      # Local dev pulls the 3B model — on CPU it's ~2x faster than the 7B
      # and keeps chat responsive. Prod stays on DEFAULT_BASE_MODEL_ID
      # (7B) from services/app/src/dequorum/inference/models.py; the app
      # is pointed at this tag via DEQUORUM_OLLAMA_MODEL below. Keep this
      # tag and the app's DEQUORUM_OLLAMA_MODEL in sync.
      OLLAMA_BOOTSTRAP_MODEL: "qwen2.5-coder:3b"
      # GIN_MODE=release silences Ollama's per-request access log lines
      # (`[GIN] ... | 200 | ... | "/api/tags"`). Errors still surface.
      GIN_MODE: "release"
      # OLLAMA_KEEP_ALIVE: how long a loaded model stays warm in memory.
      # Default is 5m; "30m" keeps it ready across iterating dev queries.
      OLLAMA_KEEP_ALIVE: "30m"
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
      # Bind-mount the entrypoint script — no build step needed; edits
      # to the script take effect on next `compose up` without a
      # rebuild. The :ro flag prevents accidental writes from inside
      # the container.
      - ./services/ollama/entrypoint.sh:/entrypoint.sh:ro
    # 30s interval is plenty — model bootstrap takes minutes, and the
    # smaller interval was generating ~360 healthcheck log lines per hour.
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --- FastAPI orchestrator app -----------------------------------------
  app:
    build:
      context: ./services/app
      target: dev
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      # Postgres URL. Read by AppConfig + Alembic + the CLI's _bootstrap.
      DEQUORUM_DATABASE_URL: "postgresql://dequorum_app:dev-only-not-for-prod@db:5432/dequorum"
      # Ollama inference target. Read by AppConfig (uses the compose-internal
      # `ollama` hostname instead of the localhost default that would 404
      # from inside the app container).
      DEQUORUM_OLLAMA_HOST: "http://ollama:11434"
      # Use the snappier 3B model locally (CPU-only dev). Must match the
      # ollama service's OLLAMA_BOOTSTRAP_MODEL tag above. Unset in prod so
      # the app falls back to DEFAULT_BASE_MODEL_ID (7B).
      DEQUORUM_OLLAMA_MODEL: "qwen2.5-coder:3b"
      # Firebase emulator. Picked up automatically by the Firebase SDK when
      # this env var is set; cleared/unset in production to hit real Firebase.
      FIREBASE_AUTH_EMULATOR_HOST: "auth:9099"
      FIREBASE_PROJECT_ID: "dequorum-local"
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot reload. The dev stage CMD re-syncs uv on each
      # start so any pyproject changes are picked up.
      - ./services/app/src:/app/src
      - ./services/app/tests:/app/tests
      - ./services/app/pyproject.toml:/app/pyproject.toml
      - ./services/app/uv.lock:/app/uv.lock

  # --- Vite dev server (SPA) --------------------------------------------
  frontend:
    build:
      context: ./services/frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_API_TARGET: "http://app:8000"
      # On WSL2 + Docker Desktop (and most bind-mount setups outside native
      # Linux), inotify file-change events don't propagate from host into
      # the container. Vite's watcher relies on chokidar, which honors
      # this env var and falls back to polling. Without it HMR silently
      # never fires — Vite logs no "page reload" lines on saves.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "200"
    volumes:
      # Bind-mount the whole project so everything (src, config, generated
      # routeTree.gen.ts, .tanstack/ tmp dir) lives on one filesystem.
      # TanStack Router's generator uses atomic rename() and previously
      # failed with EXDEV across the bind-mount boundary.
      #
      # Mount point is /workspace (not /app) so the URL /app doesn't
      # collide with the container WORKDIR — Vite's filesystem resolver
      # would otherwise try to read /app as a file and EISDIR.
      - ./services/frontend:/workspace
      # Anonymous volume preserves the container's npm-installed
      # node_modules under the bind mount above.
      - /workspace/node_modules

  # --- Caddy reverse proxy (local-only) ---------------------------------
  proxy:
    build:
      context: ./services/proxy
    depends_on:
      - app
      - frontend
    ports:
      - "80:80"

  # --- Firebase Auth (emulator locally, real Firebase in prod) ----------
  auth:
    build:
      context: ./services/auth
    ports:
      - "9099:9099"
      - "4000:4000"

volumes:
  db-data:
  ollama-models:
