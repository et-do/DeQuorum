[project]
name = "dequorum"
version = "0.1.0"
description = "Sandbox for playing around with AI architectures"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # Web stack — JSON-only API. UI lives in services/frontend (React),
    # so no Jinja templates or form-data parsing in this service.
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.14.2",
    # Database
    "psycopg[binary,pool]>=3.3.4",
    "alembic>=1.18.5",
    # Ed25519 signing/verification for the contribution proof chain. Public-key
    # signatures are what make attribution verifiable without trusting the
    # operator — load-bearing, so declared directly rather than relied on
    # transitively.
    "cryptography>=48.0.1",
    # Auth — verify Firebase ID tokens (uses FIREBASE_AUTH_EMULATOR_HOST
    # automatically in dev; falls back to a Google credentials lookup in
    # production).
    "firebase-admin>=6.5",
    # Embeddings (CPU-only torch via [tool.uv.sources] below — saves ~3 GB)
    "sentence-transformers>=5.6.0",
    # Floor kept low on purpose: a high floor forces pip to upgrade numpy
    # mid-session on hosts that ship an older 2.x (e.g. Colab), which breaks
    # the running kernel (numpy C-extension vs Python mismatch). Nothing here
    # needs >=2.4.
    "numpy>=2.5.0",
]

# Optional extras. Install any combination with
# `uv sync --extra vector --extra notebook` etc.
[project.optional-dependencies]
# Vector store + graph helpers. Not imported by current code but kept on the
# menu for when retrieval grows past BM25.
vector = [
    "chromadb>=1.5",
    "networkx>=3.4",
]
# Host-side dev tools — ipykernel for VS Code's notebook editor. Skipping
# in the container shaves ~100 MB.
notebook = [
    "ipykernel>=7.3.0",
]
# LoRA distillation PoC (dequorum distill-poc). Kept optional so the serving
# image doesn't carry training deps. transformers comes via sentence-transformers.
distill = [
    "peft>=0.19",
    "accelerate>=1.14.0",
]
experimental = [
    # Symbolic math for deterministic/algebraic reasoning
    "sympy>=1.13",
    # Category theory and compositional diagrams (DisCoPy)
    "discopy>=1.2",
    # Scientific computing
    "scipy>=1.18.0",
    # RDF/OWL knowledge graph representation (semantic triple stores for Knowledge Crystal nodes)
    "rdflib>=7.1",
    # SPARQL client for querying Wikidata, DBpedia, and other open knowledge graph endpoints
    "sparqlwrapper>=2.0",
    # WordNet + corpus access (ConceptNet, tokenizers, etc.) for bootstrapping node data
    "nltk>=3.9",
    # SMT solver for formal Proof-of-Correctness and constraint satisfaction
    "z3-solver>=4.13",
    # Visualization: graph traversals, VSA vector spaces, composition chains
    "matplotlib>=3.11.0",
    # Lightweight parser for building formal grammars/DSLs for composition query languages
    "lark>=1.2",
]
ner = [
    # spaCy NER for typed entity extraction during consolidation
    # Install model separately: uv run python -m spacy download en_core_web_sm
    "spacy>=3.7",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "pytest-benchmark>=5.1",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    # Property-based testing: verify mathematical invariants of novel architectures
    "hypothesis>=6.155.7",
    "ruff>=0.15.20",
    "mypy>=1.20",
    "pre-commit>=4.0",
]

# Force CPU-only torch wheels. Without this, uv pulls torch's default Linux
# wheel which depends on nvidia-* CUDA packages totaling 2-3 GB. The app
# container only runs embeddings on CPU (LLM inference lives in the Ollama
# service); GPU support belongs in the embedder service when we extract it.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.urls]
Homepage = "https://github.com/et-do/dequorum"
Repository = "https://github.com/et-do/dequorum"
Issues = "https://github.com/et-do/dequorum/issues"

[project.scripts]
dequorum = "dequorum.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Benchmark fixtures contain naturally-verbose human-readable strings (question
# texts and expected-behavior descriptions). Wrapping them hurts readability.
"src/dequorum/benchmark/questions.py" = ["E501"]
"src/dequorum/knowledge/seeds.py" = ["E501"]
"src/dequorum/experts/seeds.py" = ["E501"]
"src/dequorum/taxonomy/seeds.py" = ["E501"]
"src/dequorum/identity/agreement.py" = ["E501"]
# SQL statements with the full contribution column list often exceed 88; the
# alternative is unreadable line wrapping inside string literals.
"src/dequorum/knowledge/store.py" = ["E501"]
"src/dequorum/identity/seeds.py" = ["E501"]
"src/dequorum/cli.py" = ["E501"]
# Alembic migrations contain raw DDL strings whose readability suffers
# from line wrapping.
"src/dequorum/db/migrations/versions/*.py" = ["E501"]
# Test fixtures with intentionally long claim texts (must clear the 50-char min
# and read like real submissions).
"tests/intake/test_submission.py" = ["E501"]
"tests/intake/test_dedup.py" = ["E501"]
"tests/identity/test_contributor.py" = ["E501"]
"tests/taxonomy/test_taxonomy.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No `-n auto`: pytest-xdist workers would race on a shared
# `dequorum_test` Postgres database (the conftest fixture TRUNCATEs
# between tests, but workers interleave and clobber each other). Opt
# in with `pytest -n auto` when you have a per-worker DB strategy.
addopts = "--benchmark-skip"
markers = [
    "integration: marks tests as slow MCP integration tests (skip with -m 'not integration')",
    "slow: marks tests as slow (skip with -m 'not slow')",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]


[tool.hatch.build.targets.wheel]
packages = ["src/dequorum"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
